<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#ffffff"/>
  <ellipse cx="300" cy="375" rx="180" ry="22" fill="#e2e8f0"/>
  <ellipse cx="300" cy="370" rx="140" ry="15" fill="#cbd5e1"/>
  <!-- Whole Avocado (Left) -->
  <defs>
    <radialGradient id="avoSkin" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#33691e"/>
      <stop offset="60%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0a320d"/>
    </radialGradient>
    <radialGradient id="avoFlesh" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="50%" stop-color="#dce775"/>
      <stop offset="85%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#33691e"/>
    </radialGradient>
    <radialGradient id="avoSeed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="50%" stop-color="#6d4c41"/>
      <stop offset="100%" stop-color="#3e2723"/>
