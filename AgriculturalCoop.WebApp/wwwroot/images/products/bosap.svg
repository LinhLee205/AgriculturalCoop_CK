  </defs>
  <!-- Long 034 Whole Avocado -->
  <path d="M210 90 C235 90, 245 130, 245 190 C245 250, 280 300, 270 345 C260 380, 160 380, 150 345 C140 300, 175 250, 175 190 C175 130, 185 90, 210 90 Z" fill="url(#avoSkin)"/>
  <path d="M210 90 L212 75" stroke="#4e342e" stroke-width="7" stroke-linecap="round"/>
  <!-- Sliced Half with Seed (Right) -->
