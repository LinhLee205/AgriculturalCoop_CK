<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#ffffff"/>
  <ellipse cx="300" cy="375" rx="180" ry="22" fill="#e2e8f0"/>
  <defs>
    <radialGradient id="guavaSkin" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d4e157"/>
      <stop offset="50%" stop-color="#9ccc65"/>
      <stop offset="85%" stop-color="#689f38"/>
      <stop offset="100%" stop-color="#33691e"/>
    </radialGradient>
    <radialGradient id="guavaMeat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff80ab"/>
      <stop offset="60%" stop-color="#f50057"/>
      <stop offset="100%" stop-color="#c51162"/>
    </radialGradient>
  </defs>
  <!-- Whole Guava (Left) -->
  <circle cx="230" cy="255" r="115" fill="url(#guavaSkin)"/>
  <ellipse cx="190" cy="205" rx="35" ry="50" transform="rotate(-30 190 205)" fill="#ffffff" opacity="0.3"/>
  <!-- Leaf -->
  <path d="M230 140 Q235 110 240 100" stroke="#4e342e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M235 115 C270 90, 315 105, 330 130 C300 145, 260 140, 235 115 Z" fill="#2e7d32"/>
  <!-- Sliced Red Flesh Half (Right) -->
  <circle cx="385" cy="275" r="95" fill="#689f38"/>
  <circle cx="385" cy="275" r="88" fill="#f1f8e9"/>
  <circle cx="385" cy="275" r="75" fill="url(#guavaMeat)"/>
  <!-- Tiny Seeds in Center -->
  <g fill="#ffe082">
    <circle cx="370" cy="265" r="3.5"/>
    <circle cx="395" cy="260" r="3.5"/>
    <circle cx="380" cy="285" r="3.5"/>
    <circle cx="400" cy="280" r="3.5"/>
    <circle cx="365" cy="280" r="3.5"/>
  </g>
</svg>