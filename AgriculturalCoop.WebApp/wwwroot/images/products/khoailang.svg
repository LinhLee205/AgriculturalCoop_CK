<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#ffffff"/>
  <ellipse cx="300" cy="375" rx="180" ry="22" fill="#e2e8f0"/>
  <defs>
    <radialGradient id="yamSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8e24aa"/>
      <stop offset="60%" stop-color="#6a1b9a"/>
      <stop offset="100%" stop-color="#4a148c"/>
    </radialGradient>
    <radialGradient id="honeyMeat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="40%" stop-color="#ffb300"/>
      <stop offset="80%" stop-color="#fb8c00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
  </defs>
  <!-- Long Whole Sweet Potato (Left) -->
  <path d="M120 320 C100 300, 150 180, 240 160 C320 140, 340 240, 300 280 C250 330, 150 340, 120 320 Z" fill="url(#yamSkin)"/>
  <!-- Sliced Open Baked Sweet Potato glowing with golden honey (Right) -->
  <ellipse cx="390" cy="275" rx="90" ry="80" transform="rotate(-15 390 275)" fill="#4a148c"/>
  <ellipse cx="390" cy="275" rx="80" ry="70" transform="rotate(-15 390 275)" fill="url(#honeyMeat)"/>
  <!-- Glistening Honey Drop -->
  <circle cx="390" cy="275" r="14" fill="#ffffff" opacity="0.45"/>
</svg>